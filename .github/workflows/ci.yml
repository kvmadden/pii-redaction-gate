name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Committed comparison matches the engine, lexicon matches its manifest
        run: npm run check
      - name: Demo runtime copies are current
        run: node scripts/build-demo.js && git diff --exit-code -- docs/runtime

  browser-send-flow:
    name: browser-send-flow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        playwright: [1.56.1]
    # The matching image supplies Chromium and its system libraries.
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
      options: --init --shm-size=1g
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pinned browser test driver (not an app dependency)
        env:
          PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
        run: npm install --no-save --package-lock=false --ignore-scripts "playwright@$PLAYWRIGHT_VERSION"
      - name: Verify synthetic review, refusal and simulated-send flows
        run: node test/browser-flow.cjs

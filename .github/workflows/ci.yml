name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Committed comparison matches the engine, lexicon matches its manifest
        run: npm run check
      - name: Demo runtime copies are current
        run: node scripts/build-demo.js && git diff --exit-code -- docs/runtime

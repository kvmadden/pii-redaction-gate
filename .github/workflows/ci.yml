name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Committed comparison matches the engine, lexicon matches its manifest
        run: npm run check
      - name: Demo runtime copies are current
        run: node scripts/build-demo.js && git diff --exit-code -- docs/runtime

  browser-send-flow:
    # Playwright 1.56's Chromium installer does not support the ubuntu-26.04 runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pinned browser test driver (not an app dependency)
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install headless Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Verify synthetic review, refusal and simulated-send flows
        run: node test/browser-flow.cjs
